<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1E88E5"/></marker>
</defs>
<text x="30" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#263238">Сведение бёдер в тренажёре</text>
<text x="30" y="85" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#455A64">Сидя, подушки у коленей, сводим бёдра из разведённого положения</text>

<!-- machine -->
<g fill="#B0BEC5" stroke="#78909C" stroke-width="3">
<rect x="280" y="620" width="340" height="14" rx="4"/>
<rect x="430" y="400" width="40" height="222"/>
<rect x="365" y="180" width="170" height="210" rx="16"/>
<rect x="350" y="378" width="200" height="30" rx="8"/>
<!-- pad arms -->
<path d="M375 490 L375 520 L430 520" fill="none" stroke-width="10" stroke="#78909C"/>
<path d="M525 490 L525 520 L470 520" fill="none" stroke-width="10" stroke="#78909C"/>
<!-- handles -->
<rect x="346" y="340" width="10" height="40"/>
<rect x="544" y="340" width="10" height="40"/>
<rect x="328" y="378" width="42" height="14" rx="6"/>
<rect x="530" y="378" width="42" height="14" rx="6"/>
<!-- footrests -->
<rect x="295" y="608" width="72" height="12" rx="4"/>
<rect x="533" y="608" width="72" height="12" rx="4"/>
</g>

<!-- body -->
<g fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round">
<!-- lower legs -->
<path d="M308 465 Q300 520 318 590 L348 590 Q362 520 360 470 Z"/>
<path d="M592 465 Q600 520 582 590 L552 590 Q538 520 540 470 Z"/>
<ellipse cx="332" cy="601" rx="24" ry="11"/>
<ellipse cx="568" cy="601" rx="24" ry="11"/>
<!-- torso -->
<path d="M420 210 Q450 220 480 210 L515 218 Q537 225 532 255 L515 300 Q495 330 502 388 L398 388 Q405 330 385 300 L368 255 Q363 225 385 218 Z"/>
<!-- thighs -->
<path d="M448 390 Q422 442 365 472 L305 466 Q298 440 315 420 Q358 386 400 380 Z"/>
<path d="M452 390 Q478 442 535 472 L595 466 Q602 440 585 420 Q542 386 500 380 Z"/>
<ellipse cx="333" cy="455" rx="20" ry="16"/>
<ellipse cx="567" cy="455" rx="20" ry="16"/>
<!-- arms -->
<path d="M370 238 Q352 280 350 320 L344 372 L364 374 L372 322 Q382 286 392 256 Z"/>
<path d="M530 238 Q548 280 550 320 L556 372 L536 374 L528 322 Q518 286 508 256 Z"/>
<circle cx="352" cy="382" r="11"/>
<circle cx="548" cy="382" r="11"/>
<!-- neck, head -->
<rect x="437" y="190" width="26" height="26" rx="6"/>
<ellipse cx="450" cy="162" rx="27" ry="33"/>
</g>
<!-- shorts line / groin -->
<path d="M450 360 L450 392" stroke="#37474F" stroke-width="2" fill="none"/>

<!-- adductors -->
<g fill="#E53935" opacity="0.75">
<path d="M446 393 Q422 442 366 470 L362 456 Q396 430 414 392 Z"/>
<path d="M454 393 Q478 442 534 470 L538 456 Q504 430 486 392 Z"/>
</g>

<!-- pads (inner side of knees) -->
<g fill="#B0BEC5" stroke="#78909C" stroke-width="3">
<rect x="360" y="425" width="26" height="68" rx="11"/>
<rect x="514" y="425" width="26" height="68" rx="11"/>
</g>

<!-- arrows -->
<g stroke="#1E88E5" stroke-width="5" fill="none" marker-end="url(#ah)">
<path d="M215 455 L292 455"/>
<path d="M685 455 L608 455"/>
</g>
<text x="100" y="495" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1E88E5">колени внутрь</text>
<text x="620" y="495" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1E88E5">колени внутрь</text>

<!-- muscle label -->
<line x1="628" y1="352" x2="506" y2="425" stroke="#37474F" stroke-width="1.5"/>
<circle cx="506" cy="425" r="3" fill="#37474F"/>
<text x="632" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#263238">приводящие мышцы</text>
<text x="632" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#263238">бедра</text>
</svg>
