<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,5 L0,10 Z" fill="#1E88E5"/>
</marker>
</defs>
<text x="30" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#263238">Разгибание ног в тренажёре</text>
<text x="30" y="85" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#455A64">Валик на голенях, разгибаем ноги до прямых, держимся за ручки</text>

<!-- machine -->
<g fill="#B0BEC5" stroke="#78909C" stroke-width="3">
<rect x="220" y="598" width="360" height="20" rx="6"/>
<rect x="335" y="452" width="26" height="148"/>
<rect x="520" y="420" width="22" height="180"/>
<rect x="200" y="215" width="44" height="225" rx="12" transform="rotate(-8 222 430)"/>
<rect x="230" y="432" width="250" height="24" rx="10"/>
<!-- lever arm -->
<path d="M478 392 L668 376 L670 394 L482 410 Z"/>
<circle cx="480" cy="401" r="14"/>
</g>

<!-- torso -->
<path d="M268 245 Q300 228 330 245 Q348 300 340 360 Q336 400 330 430 L262 430 Q250 380 254 320 Q256 270 268 245 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<!-- neck and head -->
<path d="M288 236 L292 212 L312 212 L314 238" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<path d="M300 158 Q330 156 332 186 L338 196 L331 199 Q330 218 310 220 Q280 220 278 190 Q278 160 300 158 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>

<!-- thigh -->
<path d="M282 372 Q300 358 340 360 Q420 362 478 378 Q500 386 500 404 Q498 424 478 428 L300 432 Q272 430 270 404 Q270 384 282 372 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<!-- shin -->
<path d="M478 382 Q560 384 640 392 L688 398 Q700 402 700 414 Q698 428 686 428 L640 424 Q560 422 482 428 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<!-- calf bulge -->
<path d="M500 427 Q560 446 620 426" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<!-- foot (dorsiflexed) -->
<path d="M684 400 Q694 380 702 352 Q708 344 716 350 Q720 380 712 412 Q706 428 690 428 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<!-- kneecap hint -->
<path d="M486 384 Q500 392 498 410" fill="none" stroke="#37474F" stroke-width="2"/>

<!-- rectus femoris -->
<path d="M300 372 Q380 344 476 382 Q384 390 300 380 Z" fill="#E53935" fill-opacity="0.75" stroke="#B71C1C" stroke-width="1.5"/>

<!-- roller pad on lower shin -->
<circle cx="660" cy="374" r="17" fill="#B0BEC5" stroke="#78909C" stroke-width="3"/>

<!-- arm gripping handle -->
<circle cx="352" cy="430" r="8" fill="#B0BEC5" stroke="#78909C" stroke-width="3"/>
<rect x="346" y="430" width="12" height="22" fill="#B0BEC5" stroke="#78909C" stroke-width="3"/>
<path d="M286 252 Q306 244 316 262 L322 336 Q324 346 328 350 L360 418 Q362 432 350 434 Q340 434 336 424 L304 356 Q296 344 296 334 L280 270 Q278 256 286 252 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>

<!-- movement arrow -->
<path d="M600 590 A230 230 0 0 0 690 490" fill="none" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="650" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1E88E5">разгибаем колено</text>

<!-- muscle label -->
<line x1="385" y1="364" x2="420" y2="290" stroke="#37474F" stroke-width="1.5"/>
<circle cx="385" cy="364" r="3" fill="#37474F"/>
<text x="400" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#263238">прямая мышца бедра</text>
</svg>
