<line x1="322" y1="410" x2="284" y2="379" stroke="#ECEFF1" stroke-width="14"/>
</g>
<path d="M391 340 L447 340 L449 384 L392 384 C388 372 388 352 391 340 Z" fill="#ECEFF1"/>
<!-- glute line -->
<path d="M392 360 C384 378 388 392 400 398" fill="none" stroke="#37474F" stroke-width="2"/>

