<line x1="405" y1="478" x2="360" y2="401" stroke="#B0BEC5" stroke-width="12" stroke-linecap="round"/>
<circle cx="405" cy="478" r="11" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>

<!-- torso -->
<path d="M410 195 C440 195 460 210 462 240 C465 275 452 300 448 330 C450 355 452 380 440 398 L398 398 C382 388 378 362 388 335 C395 300 385 260 390 230 C393 205 400 195 410 195 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>

