<line x1="452" y1="280" x2="500" y2="297" stroke="#ECEFF1" stroke-width="18"/>
</g>
<circle cx="507" cy="297" r="12" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>

<!-- label -->
<line x1="398" y1="405" x2="215" y2="325" stroke="#263238" stroke-width="1.5"/>
<circle cx="398" cy="405" r="3" fill="#263238"/>
<text x="60" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#263238">Бицепс бедра</text>

<!-- arrow -->
<path d="M328 589 A135 135 0 0 1 278 432" fill="none" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="130" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">пятка к ягодице</text>
</svg>
