<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E88E5"/></marker>
</defs>
<text x="40" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#263238">Сгибание ноги стоя</text>
<text x="40" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#455A64">Пятка к ягодице, носок вытянут, таз ровный, ягодицы напряжены</text>

<!-- floor and machine frame -->
<rect x="200" y="606" width="520" height="14" rx="4" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="580" y="210" width="26" height="398" rx="5" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="512" y="296" width="72" height="12" rx="5" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<!-- axle bar from stand to knee axis (behind body) -->
<rect x="410" y="494" width="174" height="12" rx="5" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<!-- pad support bar (behind body) -->
<rect x="450" y="449" width="134" height="12" rx="5" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>

<!-- far arm -->
<g stroke-linecap="round" fill="none">
<line x1="424" y1="222" x2="446" y2="288" stroke="#37474F" stroke-width="30"/>
<line x1="446" y1="288" x2="508" y2="300" stroke="#37474F" stroke-width="24"/>
<line x1="424" y1="222" x2="446" y2="288" stroke="#CFD8DC" stroke-width="24"/>
<line x1="446" y1="288" x2="508" y2="300" stroke="#CFD8DC" stroke-width="18"/>
</g>

<!-- standing (far) leg -->
<path d="M428 372 L462 372 C468 410 470 450 467 490 C465 504 456 511 449 511 C440 511 433 504 432 490 C430 450 426 410 426 360 Z" fill="#E0E5E8" stroke="#37474F" stroke-width="3"/>
<path d="M434 498 C426 528 432 562 439 590 L459 590 C461 560 468 530 466 498" fill="#E0E5E8" stroke="#37474F" stroke-width="3"/>
<path d="M438 584 L460 584 C474 590 492 594 504 598 C511 601 509 606 502 606 L436 606 C432 600 433 590 438 584 Z" fill="#E0E5E8" stroke="#37474F" stroke-width="3"/>

<!-- neck and head -->
<g stroke-linecap="round" fill="none">
<line x1="434" y1="172" x2="430" y2="204" stroke="#37474F" stroke-width="26"/>
<line x1="434" y1="172" x2="430" y2="204" stroke="#ECEFF1" stroke-width="20"/>
</g>
<path d="M440 112 C462 112 470 130 469 146 L476 158 L469 162 C468 172 462 180 450 180 C432 180 413 170 413 146 C413 124 424 112 440 112 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<ellipse cx="436" cy="148" rx="5" ry="8" fill="none" stroke="#37474F" stroke-width="2"/>

<!-- working shank: knee (414,500) to ankle (337,436), calf on upper side -->
<path d="M398 512 C380 500 358 482 340 452 L333 428 C345 418 360 418 372 430 C392 448 420 468 432 492 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<!-- pointed foot in line with shank -->
<path d="M340 452 C322 440 302 422 288 408 C283 402 287 396 294 398 C308 402 322 412 333 424 C338 428 344 432 346 438 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>

<!-- torso + pelvis + working thigh as one outline -->
<path d="M408 198 C440 196 462 206 465 236 C468 270 463 300 462 330 C462 350 466 365 462 385 C452 410 442 440 439 470 C437 490 434 506 414 512 C398 512 389 502 389 486 C388 455 390 425 388 405 C383 385 384 360 393 335 C397 300 398 262 398 232 C398 212 401 200 408 198 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<!-- tensed glute: shading and contour -->
<path d="M394 338 C384 358 384 384 392 400 C406 406 422 400 428 386 C426 364 414 346 394 338 Z" fill="#CFD8DC" opacity="0.8"/>
<path d="M394 338 C384 358 384 384 392 400 C406 406 422 400 428 386" fill="none" stroke="#37474F" stroke-width="2"/>
<!-- kneecap -->
<path d="M424 506 C432 502 437 494 438 484" fill="none" stroke="#37474F" stroke-width="2"/>

<!-- hamstring: ischial tuberosity to popliteal fossa -->
<path d="M394 398 C386 425 386 465 396 500 C404 494 412 466 413 434 C413 414 410 402 406 398 C402 395 397 395 394 398 Z" fill="#E53935" opacity="0.75"/>

<!-- thigh pad in front of working thigh above knee -->
<rect x="440" y="428" width="22" height="56" rx="9" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>

<!-- lever: knee axis to ankle roller -->
<line x1="414" y1="500" x2="364" y2="430" stroke="#78909C" stroke-width="12" stroke-linecap="round"/>
<line x1="414" y1="500" x2="364" y2="430" stroke="#B0BEC5" stroke-width="8" stroke-linecap="round"/>
<circle cx="414" cy="500" r="10" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<circle cx="414" cy="500" r="3" fill="#78909C"/>
<!-- roller on Achilles, above heel -->
<circle cx="360" cy="420" r="13" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>

<!-- near arm -->
<g stroke-linecap="round" fill="none">
<line x1="430" y1="220" x2="454" y2="286" stroke="#37474F" stroke-width="30"/>
<line x1="454" y1="286" x2="516" y2="300" stroke="#37474F" stroke-width="24"/>
<line x1="430" y1="220" x2="454" y2="286" stroke="#ECEFF1" stroke-width="24"/>
<line x1="454" y1="286" x2="516" y2="300" stroke="#ECEFF1" stroke-width="18"/>
</g>
<circle cx="522" cy="301" r="12" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>

<!-- label -->
<line x1="400" y1="445" x2="258" y2="262" stroke="#263238" stroke-width="1.5"/>
<circle cx="400" cy="445" r="3" fill="#263238"/>
<text x="120" y="256" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#263238">Бицепс бедра</text>

<!-- arrow: arc around knee toward glute -->
<path d="M250 560 A175 175 0 0 1 326 348" fill="none" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="70" y="480" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">пятка к ягодице</text>
</svg>
