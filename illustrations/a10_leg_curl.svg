<!-- near arm -->
<g stroke-linecap="round" fill="none">
<line x1="425" y1="215" x2="452" y2="280" stroke="#37474F" stroke-width="30"/>
<line x1="452" y1="280" x2="500" y2="297" stroke="#37474F" stroke-width="24"/>
