<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E88E5"/></marker>
</defs>
<text x="30" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#263238">Растяжка икр у стены</text>
<text x="30" y="85" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#455A64">Пятка на полу, колено и корпус ведём к стене, тянем икроножную</text>
<text x="30" y="135" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#263238">Вариант 1: носок на стене</text>
<text x="475" y="135" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#263238">Вариант 2: задняя нога прямая</text>
<line x1="450" y1="115" x2="450" y2="590" stroke="#CFD8DC" stroke-width="2" stroke-dasharray="6 6"/>

<!-- ===== Variant 1 ===== -->
<g transform="translate(0,90) scale(0.85)">
<rect x="20" y="600" width="490" height="14" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="480" y="170" width="30" height="430" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<g stroke-linecap="round" stroke-linejoin="round" fill="none">
<!-- far arm -->
<path d="M356,292 L420,312 L476,322" stroke="#37474F" stroke-width="24"/>
<path d="M356,292 L420,312 L476,322" stroke="#ECEFF1" stroke-width="18"/>
<!-- back leg -->
<path d="M340,432 L286,512 L238,580" stroke="#37474F" stroke-width="44"/>
<path d="M340,432 L286,512 L238,580" stroke="#ECEFF1" stroke-width="38"/>
</g>
<!-- back foot, flat -->
<path d="M222,600 Q214,598 216,584 Q220,572 236,570 L250,572 L288,588 Q300,594 296,600 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<g stroke-linecap="round" stroke-linejoin="round" fill="none">
<!-- torso -->
<path d="M346,418 L362,292" stroke="#37474F" stroke-width="68"/>
<path d="M346,418 L362,292" stroke="#ECEFF1" stroke-width="62"/>
<!-- front leg -->
<path d="M350,430 L435,475 L424,566" stroke="#37474F" stroke-width="46"/>
<path d="M350,430 L435,475 L424,566" stroke="#ECEFF1" stroke-width="40"/>
<!-- neck -->
<path d="M366,268 L370,248" stroke="#37474F" stroke-width="24"/>
<path d="M366,268 L370,248" stroke="#ECEFF1" stroke-width="18"/>
</g>
<!-- front foot: heel on floor, toe up on wall -->
<path d="M402,596 Q398,580 414,574 L440,566 L468,552 Q479,548 479,558 L479,574 L416,600 Q404,603 402,596 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<path d="M447,463 Q458,475 450,489" fill="none" stroke="#37474F" stroke-width="2"/>
<!-- head -->
<ellipse cx="373" cy="224" rx="25" ry="30" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<path d="M397,218 L404,230 L397,233" fill="none" stroke="#37474F" stroke-width="2.5" stroke-linejoin="round"/>
<ellipse cx="368" cy="226" rx="4" ry="7" fill="none" stroke="#37474F" stroke-width="2"/>
<!-- near arm -->
<g stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M362,298 L424,318 L472,330" stroke="#37474F" stroke-width="24"/>
<path d="M362,298 L424,318 L472,330" stroke="#ECEFF1" stroke-width="18"/>
</g>
<ellipse cx="474" cy="326" rx="7" ry="16" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<!-- arrows -->
<path d="M200,300 L300,300" stroke="#1E88E5" stroke-width="5" fill="none" marker-end="url(#ar)"/>
<text x="150" y="282" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#1E88E5">корпус к стене</text>
<path d="M392,418 Q440,412 474,450" stroke="#1E88E5" stroke-width="5" fill="none" marker-end="url(#ar)"/>
<text x="398" y="378" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#1E88E5">колено</text><text x="398" y="402" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#1E88E5">к стене</text>
</g>

<!-- ===== Variant 2 ===== -->
<g transform="translate(450,90) scale(0.85)">
<rect x="20" y="600" width="490" height="14" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="480" y="170" width="30" height="430" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<g stroke-linecap="round" stroke-linejoin="round" fill="none">
<!-- far arm -->
<path d="M354,326 L414,316 L474,304" stroke="#37474F" stroke-width="24"/>
<path d="M354,326 L414,316 L474,304" stroke="#ECEFF1" stroke-width="18"/>
<!-- back leg straight -->
<path d="M252,432 L173,508 L98,580" stroke="#37474F" stroke-width="44"/>
<path d="M252,432 L173,508 L98,580" stroke="#ECEFF1" stroke-width="38"/>
</g>
<!-- back foot, heel down, toe forward -->
<path d="M80,600 Q72,598 74,584 Q78,570 96,568 L110,572 L150,588 Q162,594 158,600 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<g stroke-linecap="round" stroke-linejoin="round" fill="none">
<!-- torso -->
<path d="M258,424 L356,326" stroke="#37474F" stroke-width="68"/>
<path d="M258,424 L356,326" stroke="#ECEFF1" stroke-width="62"/>
<!-- front leg -->
<path d="M262,432 L345,478 L388,574" stroke="#37474F" stroke-width="46"/>
<path d="M262,432 L345,478 L388,574" stroke="#ECEFF1" stroke-width="40"/>
<!-- neck -->
<path d="M368,310 L384,294" stroke="#37474F" stroke-width="24"/>
<path d="M368,310 L384,294" stroke="#ECEFF1" stroke-width="18"/>
</g>
<!-- front foot flat -->
<path d="M376,600 Q368,598 370,584 Q374,570 390,568 L404,572 L442,588 Q454,594 450,600 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<path d="M357,466 Q368,478 360,492" fill="none" stroke="#37474F" stroke-width="2"/>
<!-- head -->
<ellipse cx="398" cy="272" rx="25" ry="30" fill="#ECEFF1" stroke="#37474F" stroke-width="3" transform="rotate(30 398 272)"/>
<path d="M418,256 L428,266 L421,271" fill="none" stroke="#37474F" stroke-width="2.5" stroke-linejoin="round"/>
<ellipse cx="392" cy="275" rx="4" ry="7" fill="none" stroke="#37474F" stroke-width="2" transform="rotate(30 392 275)"/>
<!-- near arm -->
<g stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M360,332 L420,324 L472,314" stroke="#37474F" stroke-width="24"/>
<path d="M360,332 L420,324 L472,314" stroke="#ECEFF1" stroke-width="18"/>
</g>
<ellipse cx="474" cy="310" rx="7" ry="16" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<!-- arrows -->
<path d="M120,380 L230,380" stroke="#1E88E5" stroke-width="5" fill="none" marker-end="url(#ar)"/>
<text x="70" y="362" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#1E88E5">корпус к стене</text>
<path d="M60,505 L74,568" stroke="#1E88E5" stroke-width="5" fill="none" marker-end="url(#ar)"/>
<text x="20" y="490" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#1E88E5">пятка в пол</text>
</g>
</svg>
