<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 Z" fill="#1E88E5"/>
</marker>
</defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#263238">Разгибание ног в тренажёре</text>
<text x="40" y="88" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#455A64">Валик на голенях, разгибаем ноги до прямых, держимся за ручки</text>

<!-- machine -->
<rect x="130" y="596" width="460" height="16" rx="6" fill="#B0BEC5" stroke="#78909C" stroke-width="3"/>
<rect x="150" y="170" width="30" height="430" rx="6" fill="#B0BEC5" stroke="#78909C" stroke-width="3"/>
<rect x="335" y="448" width="32" height="150" rx="5" fill="#B0BEC5" stroke="#78909C" stroke-width="3"/>
<rect x="178" y="400" width="60" height="20" rx="5" fill="#B0BEC5" stroke="#78909C" stroke-width="3"/>
<rect x="196" y="205" width="38" height="232" rx="14" fill="#B0BEC5" stroke="#78909C" stroke-width="3" transform="rotate(-8 215 437)"/>
<rect x="215" y="420" width="270" height="30" rx="12" fill="#B0BEC5" stroke="#78909C" stroke-width="3"/>
<!-- lever arm (far side) -->
<path d="M470 395 L612 342" stroke="#78909C" stroke-width="20" stroke-linecap="round"/>
<path d="M470 395 L612 342" stroke="#B0BEC5" stroke-width="14" stroke-linecap="round"/>
<circle cx="470" cy="395" r="14" fill="#B0BEC5" stroke="#78909C" stroke-width="3"/>

<!-- ghost start position -->
<path d="M452 410 L478 570 Q482 588 500 588 L512 586 Q522 580 516 566 L494 410" fill="none" stroke="#90A4AE" stroke-width="2.5" stroke-dasharray="8 6"/>

<!-- torso -->
<path d="M246 425 L222 260 Q218 228 250 222 L272 222 Q302 228 306 262 L310 340 Q312 380 305 405 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<!-- neck and head -->
<path d="M252 226 L254 200 L278 200 L280 226 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<ellipse cx="266" cy="176" rx="27" ry="33" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<path d="M292 172 L299 184 L291 187" fill="#ECEFF1" stroke="#37474F" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M255 170 Q262 176 256 188" fill="none" stroke="#37474F" stroke-width="2"/>

<!-- thigh -->
<path d="M262 372 Q280 352 320 356 L450 368 Q478 372 480 395 Q480 420 455 420 L270 422 Q240 420 242 398 Q244 382 262 372 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<!-- rectus femoris -->
<path d="M292 366 Q375 350 458 376 Q378 392 292 366 Z" fill="#E53935" opacity="0.75"/>
<!-- shin -->
<path d="M468 372 L640 356 Q652 356 652 368 L650 384 Q600 398 560 410 Q520 424 478 420 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<!-- knee -->
<path d="M458 371 Q484 368 488 392 Q488 416 466 420" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<!-- foot (dorsiflexed) -->
<path d="M640 357 L660 352 Q680 330 694 316 Q708 310 711 322 Q710 334 690 362 L676 388 Q664 400 648 392 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<!-- pad on shins -->
<circle cx="612" cy="342" r="18" fill="#B0BEC5" stroke="#78909C" stroke-width="3"/>

<!-- arm (near side) -->
<path d="M262 248 L284 342 L326 422" fill="none" stroke="#37474F" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M262 248 L284 342 L326 422" fill="none" stroke="#ECEFF1" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
<!-- handle and hand -->
<rect x="300" y="430" width="70" height="14" rx="7" fill="#B0BEC5" stroke="#78909C" stroke-width="3"/>
<ellipse cx="334" cy="433" rx="17" ry="13" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>

<!-- movement arrow -->
<path d="M540 588 A200 200 0 0 0 668 440" fill="none" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="678" y="505" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1E88E5">разгибаем колени</text>

<!-- label -->
<line x1="480" y1="262" x2="380" y2="362" stroke="#37474F" stroke-width="1.5"/>
<circle cx="380" cy="362" r="3" fill="#37474F"/>
<text x="484" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#263238">Прямая мышца бедра</text>
</svg>
