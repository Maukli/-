<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ah" markerWidth="20" markerHeight="20" refX="10" refY="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,2 L18,10 L0,18 Z" fill="#1E88E5"/></marker>
<marker id="ah2" markerWidth="16" markerHeight="16" refX="8" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,2 L14,8 L0,14 Z" fill="#1E88E5"/></marker>
</defs>
<text x="40" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#263238">Растяжка бицепса бедра лёжа</text>
<text x="40" y="90" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#455A64">Нога прямая, тянем её к себе за бедро или голень, носок на себя</text>
<!-- mat -->
<rect x="90" y="540" width="600" height="16" rx="6" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<g stroke="#37474F" stroke-width="3" fill="#ECEFF1" stroke-linejoin="round" stroke-linecap="round">
<!-- lower leg on floor -->
<path d="M375 503 Q430 505 480 514 Q530 518 585 522 L590 539 L375 539 Z"/>
<path d="M584 521 L598 494 Q611 489 613 502 L607 539 L589 539 Z"/>
<!-- raised leg -->
<path d="M338 535 Q328 470 326 414 Q322 360 309 307 L328 303 Q340 360 357 407 Q382 460 394 535 Z"/>
<!-- raised foot, toes pulled to face -->
<path d="M309 307 Q304 290 318 286 Q330 288 330 302 L328 304 Q300 318 276 320 Q266 316 270 306 Q290 298 309 307 Z"/>
<!-- torso -->
<path d="M200 505 Q205 480 245 478 Q290 482 325 492 Q370 492 395 506 L397 539 L200 539 Z"/>
<!-- neck -->
<path d="M182 510 L206 506 L206 534 L182 536 Z"/>
<!-- head -->
<circle cx="160" cy="511" r="28"/>
<path d="M140 494 Q150 482 166 483" fill="none"/>
<!-- arm outline -->
<line x1="228" y1="492" x2="290" y2="458" stroke-width="24"/>
<line x1="290" y1="458" x2="336" y2="418" stroke-width="20"/>
</g>
<!-- arm fill -->
<g stroke="#ECEFF1" stroke-linecap="round">
<line x1="228" y1="492" x2="290" y2="458" stroke-width="18"/>
<line x1="290" y1="458" x2="336" y2="418" stroke-width="14"/>
</g>
<circle cx="290" cy="458" r="2" fill="#37474F"/>
<!-- hand on back of thigh -->
<ellipse cx="338" cy="414" rx="13" ry="10" transform="rotate(-50 338 414)" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<!-- arrows -->
<path d="M352 262 Q305 232 258 266" fill="none" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="365" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1E88E5">тянем ногу к груди</text>
<path d="M300 345 Q270 352 256 332" fill="none" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah2)"/>
<text x="130" y="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1E88E5">носок на себя</text>
<text x="420" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#455A64">вторая нога прямая на полу</text>
</svg>
