<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E88E5"/></marker>
</defs>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="30" y="50" font-size="30" font-weight="bold" fill="#263238">Подтягивания</text>
<text x="30" y="84" font-size="20" fill="#455A64">Сначала опускаем лопатки, потом тянемся грудью к перекладине</text>
</g>
<!-- floor and frame -->
<line x1="150" y1="625" x2="750" y2="625" stroke="#78909C" stroke-width="2"/>
<rect x="180" y="115" width="18" height="510" rx="4" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="702" y="115" width="18" height="510" rx="4" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="180" y="126" width="540" height="16" rx="6" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<text x="450" y="118" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#455A64">вид сзади</text>

<!-- legs -->
<g stroke-linecap="round">
<line x1="428" y1="440" x2="432" y2="530" stroke="#37474F" stroke-width="40"/>
<line x1="472" y1="440" x2="468" y2="530" stroke="#37474F" stroke-width="40"/>
<line x1="432" y1="530" x2="436" y2="595" stroke="#37474F" stroke-width="30"/>
<line x1="468" y1="530" x2="464" y2="595" stroke="#37474F" stroke-width="30"/>
<line x1="428" y1="440" x2="432" y2="530" stroke="#ECEFF1" stroke-width="34"/>
<line x1="472" y1="440" x2="468" y2="530" stroke="#ECEFF1" stroke-width="34"/>
<line x1="432" y1="530" x2="436" y2="595" stroke="#ECEFF1" stroke-width="24"/>
<line x1="468" y1="530" x2="464" y2="595" stroke="#ECEFF1" stroke-width="24"/>
</g>
<!-- feet (heels, toes pointing away) -->
<ellipse cx="436" cy="606" rx="11" ry="12" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<ellipse cx="464" cy="606" rx="11" ry="12" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<line x1="450" y1="450" x2="450" y2="480" stroke="#37474F" stroke-width="2"/>

<!-- arms -->
<g stroke-linecap="round">
<line x1="392" y1="252" x2="322" y2="222" stroke="#37474F" stroke-width="34"/>
<line x1="508" y1="252" x2="578" y2="222" stroke="#37474F" stroke-width="34"/>
<line x1="322" y1="222" x2="330" y2="148" stroke="#37474F" stroke-width="27"/>
<line x1="578" y1="222" x2="570" y2="148" stroke="#37474F" stroke-width="27"/>
<line x1="392" y1="252" x2="322" y2="222" stroke="#ECEFF1" stroke-width="28"/>
<line x1="508" y1="252" x2="578" y2="222" stroke="#ECEFF1" stroke-width="28"/>
<line x1="322" y1="222" x2="330" y2="148" stroke="#ECEFF1" stroke-width="21"/>
<line x1="578" y1="222" x2="570" y2="148" stroke="#ECEFF1" stroke-width="21"/>
</g>

<!-- torso with pelvis -->
<path d="M 398 236 Q 450 226 502 236 C 520 244, 524 262, 512 276 C 506 320, 494 360, 490 395 C 500 410, 504 430, 498 452 L 402 452 C 396 430, 400 410, 410 395 C 406 360, 394 320, 388 276 C 376 262, 380 244, 398 236 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<!-- glute line -->
<path d="M 450 420 L 450 452 M 412 448 Q 430 456 450 450 Q 470 456 488 448" fill="none" stroke="#37474F" stroke-width="2"/>
<!-- neck and head -->
<path d="M 438 214 L 436 238 L 464 238 L 462 214 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<ellipse cx="450" cy="190" rx="24" ry="30" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<path d="M 427 182 C 430 158, 470 158, 473 182" fill="none" stroke="#37474F" stroke-width="3"/>

<!-- scapulae and spine -->
<path d="M 410 256 L 440 260 L 432 318 Z" fill="none" stroke="#78909C" stroke-width="2"/>
<path d="M 490 256 L 460 260 L 468 318 Z" fill="none" stroke="#78909C" stroke-width="2"/>
<line x1="450" y1="240" x2="450" y2="420" stroke="#78909C" stroke-width="2" stroke-dasharray="4 4"/>

<!-- latissimus dorsi -->
<path d="M 391 270 C 396 310, 404 350, 410 392 L 447 418 L 447 322 C 440 300, 424 278, 400 266 Z" fill="#E53935" opacity="0.75" stroke="#B71C1C" stroke-width="1.5"/>
<path d="M 509 270 C 504 310, 496 350, 490 392 L 453 418 L 453 322 C 460 300, 476 278, 500 266 Z" fill="#E53935" opacity="0.75" stroke="#B71C1C" stroke-width="1.5"/>

<!-- hands on bar -->
<circle cx="330" cy="138" r="13" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<circle cx="570" cy="138" r="13" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>

<!-- arrows -->
<line x1="290" y1="460" x2="290" y2="350" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="232" y="490" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">грудью</text>
<text x="232" y="512" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">вверх</text>
<line x1="610" y1="250" x2="610" y2="320" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="588" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">лопатки</text>
<text x="588" y="372" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">вниз</text>

<!-- label -->
<text x="560" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#263238">широчайшие</text>
<line x1="558" y1="464" x2="478" y2="365" stroke="#263238" stroke-width="1.5"/>
<line x1="558" y1="464" x2="425" y2="350" stroke="#263238" stroke-width="1.5"/>
</svg>
