<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ah" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L4,2 L0,4 Z" fill="#1E88E5"/></marker>
</defs>
<text x="40" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#263238">Растяжка передней поверхности бедра</text>
<text x="40" y="92" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#455A64">Таз подкручен, ягодицы напряжены, поясница не прогибается</text>
<!-- mat -->
<rect x="150" y="562" width="560" height="14" rx="6" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<!-- outline layer -->
<g stroke="#37474F" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="398" y1="478" x2="338" y2="350" stroke-width="66"/>
<line x1="338" y1="340" x2="326" y2="300" stroke-width="28"/>
<line x1="410" y1="500" x2="560" y2="538" stroke-width="50"/>
<line x1="556" y1="542" x2="385" y2="546" stroke-width="38"/>
<path d="M392,546 L330,552" stroke-width="22"/>
<line x1="332" y1="352" x2="292" y2="448" stroke-width="28"/>
<line x1="292" y1="448" x2="262" y2="548" stroke-width="24"/>
<line x1="262" y1="550" x2="236" y2="554" stroke-width="18"/>
</g>
<!-- fill layer -->
<g stroke="#ECEFF1" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="398" y1="478" x2="338" y2="350" stroke-width="60"/>
<line x1="338" y1="340" x2="326" y2="300" stroke-width="22"/>
<line x1="410" y1="500" x2="560" y2="538" stroke-width="44"/>
<line x1="556" y1="542" x2="385" y2="546" stroke-width="32"/>
<path d="M392,546 L330,552" stroke-width="16"/>
<line x1="332" y1="352" x2="292" y2="448" stroke-width="22"/>
<line x1="292" y1="448" x2="262" y2="548" stroke-width="18"/>
<line x1="262" y1="550" x2="236" y2="554" stroke-width="12"/>
</g>
<!-- near arm redraw over torso edge -->
<g stroke-linecap="round" fill="none">
<line x1="292" y1="448" x2="262" y2="548" stroke="#37474F" stroke-width="24"/>
<line x1="292" y1="448" x2="262" y2="548" stroke="#ECEFF1" stroke-width="18"/>
<line x1="332" y1="352" x2="292" y2="448" stroke="#37474F" stroke-width="28"/>
<line x1="332" y1="352" x2="292" y2="448" stroke="#ECEFF1" stroke-width="22"/>

</g>
<!-- head -->
<circle cx="320" cy="270" r="29" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<path d="M347,264 L354,274 L346,277" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<path d="M296,252 Q312,236 338,246" fill="none" stroke="#37474F" stroke-width="3"/>
<!-- joint hints -->

<!-- arrow: lean back -->
<path d="M430,330 Q420,240 365,215" fill="none" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="450" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1E88E5">отклоняем корпус назад</text>
<text x="600" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#455A64">колени на коврике</text>
<text x="600" y="420" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#455A64">статика 2 минуты</text>
</svg>
