<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" markerWidth="3.5" markerHeight="3.5" refX="5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#1E88E5"/></marker>
</defs>
<text x="40" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#263238">Баланс на одной ноге</text>
<text x="40" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#455A64">Таз ровный, колено опорной ноги над стопой, руки на поясе</text>
<!-- mat -->
<rect x="330" y="604" width="240" height="12" rx="5" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<!-- standing leg (viewer left) -->
<path d="M398,388 C396,440 410,470 410,500 C405,530 413,560 416,586 L442,586 C444,560 451,528 446,500 C449,470 453,440 452,418 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<ellipse cx="428" cy="497" rx="9" ry="11" fill="none" stroke="#37474F" stroke-width="2"/>
<path d="M412,582 L446,582 Q453,594 451,604 L407,604 Q405,592 412,582 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<!-- neck and ears -->
<path d="M435,186 C437,198 437,208 433,218 L467,218 C463,208 463,198 465,186 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<ellipse cx="424" cy="166" rx="6" ry="10" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<ellipse cx="476" cy="166" rx="6" ry="10" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<ellipse cx="450" cy="162" rx="26" ry="32" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<!-- torso with pelvis -->
<path d="M438,212 C420,216 396,216 386,230 C378,246 390,262 395,272 C399,298 410,318 410,334 C402,352 395,366 395,388 C396,404 408,414 426,420 L450,428 L474,420 C492,414 504,404 505,388 C505,366 498,352 490,334 C490,318 501,298 505,272 C510,262 522,246 514,230 C504,216 480,216 462,212 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<path d="M450,232 L450,300" stroke="#90A4AE" stroke-width="1.5" fill="none"/>
<!-- gluteus medius, lateral pelvis, standing side -->
<path d="M396,360 C404,356 418,358 427,363 C423,378 411,392 401,403 C395,390 394,374 396,360 Z" fill="#E53935" opacity="0.75"/>
<!-- raised leg (viewer right), thigh toward viewer -->
<path d="M464,434 C463,460 468,484 470,506 L498,506 C500,484 506,460 506,434 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<path d="M467,503 L501,503 Q508,514 505,528 L465,528 Q460,514 467,503 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<path d="M452,398 C466,386 506,384 516,396 C522,412 518,432 504,440 C490,445 466,445 456,438 C448,426 446,410 452,398 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<ellipse cx="485" cy="414" rx="12" ry="13" fill="none" stroke="#37474F" stroke-width="2"/>
<!-- pelvis level line -->
<line x1="360" y1="352" x2="540" y2="352" stroke="#455A64" stroke-width="2" stroke-dasharray="8 6"/>
<text x="548" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#455A64">таз ровный, не проваливается</text>
<!-- arms -->
<g stroke-linecap="round" fill="none">
<line x1="393" y1="236" x2="342" y2="312" stroke="#37474F" stroke-width="28"/>
<line x1="342" y1="312" x2="396" y2="342" stroke="#37474F" stroke-width="23"/>
<line x1="393" y1="236" x2="342" y2="312" stroke="#ECEFF1" stroke-width="22"/>
<line x1="342" y1="312" x2="396" y2="342" stroke="#ECEFF1" stroke-width="17"/>
<line x1="507" y1="236" x2="558" y2="312" stroke="#37474F" stroke-width="28"/>
<line x1="558" y1="312" x2="504" y2="342" stroke="#37474F" stroke-width="23"/>
<line x1="507" y1="236" x2="558" y2="312" stroke="#ECEFF1" stroke-width="22"/>
<line x1="558" y1="312" x2="504" y2="342" stroke="#ECEFF1" stroke-width="17"/>
</g>
<ellipse cx="405" cy="345" rx="14" ry="10" fill="#ECEFF1" stroke="#37474F" stroke-width="3" transform="rotate(20 405 345)"/>
<ellipse cx="495" cy="345" rx="14" ry="10" fill="#ECEFF1" stroke="#37474F" stroke-width="3" transform="rotate(-20 495 345)"/>
<!-- muscle label -->
<line x1="305" y1="434" x2="406" y2="380" stroke="#37474F" stroke-width="1.5"/>
<circle cx="406" cy="380" r="3" fill="#37474F"/>
<text x="90" y="440" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#263238">Средняя ягодичная</text>
<text x="90" y="464" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#263238">опорной ноги</text>
<!-- arrows -->
<line x1="560" y1="470" x2="560" y2="415" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="580" y="440" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">колено держим</text>
<text x="580" y="463" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">на уровне таза</text>
<line x1="385" y1="530" x2="385" y2="588" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="370" y="562" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">давим стопой в пол</text>
</svg>
