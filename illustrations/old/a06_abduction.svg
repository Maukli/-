<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ah" markerWidth="4" markerHeight="4" refX="1.5" refY="2" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L4,2 L0,4 Z" fill="#1E88E5"/>
</marker>
<marker id="ahs" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0,0 L8,4 L0,8 Z" fill="#37474F"/>
</marker>
</defs>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#263238">Отведение бедра лёжа на боку</text>
<text x="40" y="88" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#455A64">Пятка ведёт вверх, носок вперёд, таз не заваливается назад</text>

<!-- mat -->
<rect x="40" y="452" width="830" height="160" rx="14" fill="#B0BEC5" stroke="#78909C" stroke-width="3"/>

<!-- start position ghost of top leg -->
<path d="M520,432 Q640,438 760,442 L812,446 Q832,450 830,466 Q826,480 806,480 L740,482 Q640,490 548,500" fill="none" stroke="#90A4AE" stroke-width="2.5" stroke-dasharray="8 7"/>

<g stroke="#37474F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="#ECEFF1">
<!-- bottom arm extended overhead on mat -->
<path d="M292,486 Q220,488 150,488 L92,488 Q62,490 62,500 Q64,512 92,512 L150,513 Q220,516 292,518 Z"/>
<!-- bottom shin, lying on mat behind the body line -->
<path d="M606,548 L688,468 Q700,460 712,466 L748,480 Q760,488 752,498 L716,496 Q710,494 706,488 L634,572 Z"/>
<!-- bottom thigh, hip flexed about 45 degrees -->
<path d="M498,486 Q560,512 616,542 Q644,558 632,578 Q618,592 596,582 Q544,556 492,522 Z"/>
<!-- torso: shoulder, ribcage, waist, pelvis in one line -->
<path d="M280,440 Q292,420 322,420 Q360,422 392,430 Q414,438 428,444 Q446,430 470,426 Q500,422 524,430 Q548,446 550,480 Q550,508 526,520 L292,520 Q272,512 270,482 Q270,456 280,440 Z"/>
<!-- neck -->
<path d="M282,446 Q264,446 246,450 L248,490 Q266,494 284,496 Z"/>
<!-- head in profile, resting on bottom arm, face forward -->
<path d="M246,430 Q214,410 182,418 Q156,428 156,458 Q158,476 170,486 Q180,492 186,494 Q190,504 198,506 Q204,504 204,498 Q212,502 220,502 Q236,504 248,494 Q258,482 258,462 Q258,442 246,430 Z"/>
</g>
<!-- hair -->
<path d="M160,446 Q162,420 190,414 Q224,408 248,432 Q226,424 204,426 Q180,430 160,446 Z" fill="#90A4AE" stroke="#37474F" stroke-width="2" stroke-linejoin="round"/>
<!-- face details -->
<path d="M180,476 Q186,472 192,476" fill="none" stroke="#37474F" stroke-width="2" stroke-linecap="round"/>
<path d="M212,494 L222,494" fill="none" stroke="#37474F" stroke-width="2" stroke-linecap="round"/>
<path d="M222,452 Q232,448 234,460 Q232,470 222,468" fill="none" stroke="#37474F" stroke-width="2" stroke-linecap="round"/>

<!-- ribcage line -->
<path d="M340,432 Q372,448 384,500" fill="none" stroke="#37474F" stroke-width="2" stroke-linecap="round"/>

<!-- top leg, abducted from hip -->
<path d="M488,426 Q536,402 580,383 Q604,372 627,366 Q664,346 699,329 Q734,314 764,303 L776,325 Q746,344 717,365 Q684,384 647,404 Q626,418 606,433 Q570,460 534,488 Q530,470 520,452 Z" fill="#ECEFF1" stroke="none"/>
<g fill="none" stroke="#37474F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M488,426 Q536,402 580,383 Q604,372 627,366 Q664,346 699,329 Q734,314 764,303"/>
<path d="M548,486 Q570,460 606,433 Q626,418 647,404 Q684,384 717,365 Q746,344 776,325"/>
</g>
<!-- knee hint -->
<path d="M632,378 Q640,384 638,394" fill="none" stroke="#37474F" stroke-width="1.8" stroke-linecap="round"/>
<!-- foot: heel highest, toes horizontal forward -->
<path d="M764,303 Q770,290 784,286 Q800,284 806,294 Q830,302 852,310 Q864,316 860,326 Q854,334 840,332 L800,330 Q786,330 776,325 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<g fill="none" stroke="#37474F" stroke-width="1.6" stroke-linecap="round">
<path d="M846,324 L852,332"/>
<path d="M838,324 L842,332"/>
</g>

<!-- top arm: palm on mat in front of chest -->
<path d="M290,438 Q305,420 322,435 L382,512 Q390,526 380,536 L374,574 L404,580 Q418,586 410,596 L362,598 Q350,596 350,584 L354,535 L294,462 Q284,450 290,438 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<path d="M370,520 Q376,528 372,536" fill="none" stroke="#37474F" stroke-width="1.8" stroke-linecap="round"/>

<!-- iliac crest -->
<path d="M440,452 Q462,432 500,428" fill="none" stroke="#37474F" stroke-width="2" stroke-dasharray="5 4"/>
<!-- gluteus medius fan -->
<path d="M440,454 Q462,432 500,428 L526,438 Q508,458 482,466 Q456,468 440,454 Z" fill="#E53935" opacity="0.75"/>
<g fill="none" stroke="#B71C1C" stroke-width="1.2" opacity="0.7">
<path d="M452,458 L524,440"/>
<path d="M466,442 L524,439"/>
<path d="M486,432 L524,438"/>
</g>
<!-- greater trochanter -->
<circle cx="530" cy="440" r="6" fill="#ECEFF1" stroke="#37474F" stroke-width="2.5"/>

<!-- muscle label -->
<line x1="400" y1="340" x2="476" y2="448" stroke="#37474F" stroke-width="1.5"/>
<circle cx="476" cy="448" r="3" fill="#37474F"/>
<text x="250" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#263238">средняя ягодичная мышца</text>

<!-- pelvis stays square -->
<line x1="470" y1="468" x2="470" y2="602" stroke="#455A64" stroke-width="2" stroke-dasharray="6 5"/>
<text x="430" y="636" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#263238">таз ровно, не назад</text>

<!-- movement arrow -->
<path d="M835,455 A330 330 0 0 0 820,362" fill="none" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="560" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1E88E5">пятка ведёт вверх</text>
<line x1="740" y1="268" x2="784" y2="284" stroke="#1E88E5" stroke-width="1.5"/>

<!-- toe label -->
<text x="735" y="226" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#263238">носок вперёд</text>
<line x1="852" y1="234" x2="856" y2="306" stroke="#37474F" stroke-width="1.5" marker-end="url(#ahs)"/>
</svg>
