<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E88E5"/></marker>
</defs>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="30" y="50" font-size="30" font-weight="bold" fill="#263238">Жим в тренажёре сидя</text>
<text x="30" y="84" font-size="20" fill="#455A64">Спина прижата к спинке, жмём до почти прямых рук, назад медленно</text>
</g>

<line x1="100" y1="600" x2="820" y2="600" stroke="#78909C" stroke-width="2"/>
<!-- weight stack -->
<rect x="120" y="360" width="90" height="240" rx="4" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<g stroke="#78909C" stroke-width="2">
<line x1="120" y1="400" x2="210" y2="400"/><line x1="120" y1="440" x2="210" y2="440"/>
<line x1="120" y1="480" x2="210" y2="480"/><line x1="120" y1="520" x2="210" y2="520"/>
<line x1="120" y1="560" x2="210" y2="560"/>
</g>
<!-- column -->
<rect x="230" y="118" width="30" height="482" rx="5" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<!-- lever -->
<path d="M 245 132 L 500 132 Q 552 132 553 185 L 553 285" fill="none" stroke="#78909C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 245 132 L 500 132 Q 552 132 553 185 L 553 285" fill="none" stroke="#B0BEC5" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="245" cy="132" r="15" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<circle cx="245" cy="132" r="4" fill="#78909C"/>
<!-- seat post and seat -->
<rect x="335" y="440" width="18" height="160" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="290" y="590" width="110" height="10" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="262" y="422" width="168" height="20" rx="6" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<!-- backrest -->
<rect x="262" y="230" width="26" height="192" rx="8" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>

<!-- legs -->
<g stroke-linecap="round">
<line x1="325" y1="400" x2="452" y2="402" stroke="#37474F" stroke-width="48"/>
<line x1="452" y1="402" x2="468" y2="560" stroke="#37474F" stroke-width="36"/>
<line x1="325" y1="400" x2="452" y2="402" stroke="#ECEFF1" stroke-width="42"/>
<line x1="452" y1="402" x2="468" y2="560" stroke="#ECEFF1" stroke-width="30"/>
</g>
<path d="M 452 560 L 486 560 C 500 572, 518 584, 522 598 L 450 598 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>

<!-- torso -->
<path d="M 292 420 L 292 300 C 292 278, 305 266, 330 264 C 355 264, 372 278, 376 300 C 380 325, 374 345, 366 365 C 362 385, 365 405, 368 422 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<!-- neck and head -->
<path d="M 318 268 L 320 240 L 342 240 L 344 268 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<ellipse cx="333" cy="218" rx="24" ry="29" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<path d="M 356 212 L 363 224 L 356 227" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<path d="M 310 206 C 312 186, 348 184, 356 205" fill="none" stroke="#37474F" stroke-width="3"/>

<!-- pec (under arm) -->

<!-- arm -->
<g stroke-linecap="round">
<line x1="335" y1="292" x2="440" y2="298" stroke="#37474F" stroke-width="32"/>
<line x1="440" y1="298" x2="540" y2="302" stroke="#37474F" stroke-width="26"/>
<line x1="335" y1="292" x2="440" y2="298" stroke="#ECEFF1" stroke-width="26"/>
<line x1="440" y1="298" x2="540" y2="302" stroke="#ECEFF1" stroke-width="20"/>
</g>
<!-- handle and hand -->
<rect x="546" y="270" width="15" height="62" rx="5" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<circle cx="549" cy="302" r="13" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<!-- pec overlay at chest, visible part over arm root -->
<path d="M 342 296 L 375 296 C 378 312, 375 328, 368 344 C 356 340, 344 326, 338 310 Z" fill="#E53935" opacity="0.75"/>

<!-- arrows -->
<line x1="420" y1="245" x2="530" y2="245" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="420" y="232" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">выжимаем</text>
<line x1="530" y1="366" x2="430" y2="366" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="410" y="356" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5" text-anchor="start" dx="0">назад медленно</text>

<!-- label -->
<g font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#263238">
<text x="600" y="318">большая</text>
<text x="600" y="340">грудная мышца</text>
<line x1="596" y1="326" x2="368" y2="324" stroke="#263238" stroke-width="1.5"/>
</g>
</svg>
