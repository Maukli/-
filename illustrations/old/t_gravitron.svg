<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E88E5"/></marker>
</defs>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="30" y="50" font-size="30" font-weight="bold" fill="#263238">Подтягивания в гравитроне</text>
<text x="30" y="84" font-size="20" fill="#455A64">Колени на платформе, тянемся грудью к рукоятям, вниз медленно</text>
</g>
<!-- floor and machine -->
<line x1="180" y1="625" x2="820" y2="625" stroke="#78909C" stroke-width="2"/>
<rect x="640" y="115" width="24" height="510" rx="4" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="490" y="120" width="174" height="16" rx="6" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="516" y="132" width="14" height="40" rx="5" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<!-- weight stack -->
<rect x="700" y="330" width="80" height="295" rx="4" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<g stroke="#78909C" stroke-width="2"><line x1="700" y1="490" x2="780" y2="490"/><line x1="700" y1="515" x2="780" y2="515"/><line x1="700" y1="540" x2="780" y2="540"/><line x1="700" y1="565" x2="780" y2="565"/><line x1="700" y1="590" x2="780" y2="590"/></g>
<line x1="740" y1="330" x2="740" y2="490" stroke="#78909C" stroke-width="3"/>
<!-- platform and lever -->
<rect x="398" y="528" width="16" height="44" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="390" y="562" width="262" height="16" rx="6" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<circle cx="652" cy="570" r="9" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="300" y="506" width="185" height="24" rx="10" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>

<!-- legs: thigh down to knee, shin back on pad -->
<g stroke-linecap="round">
<line x1="420" y1="392" x2="452" y2="482" stroke="#37474F" stroke-width="46"/>
<line x1="452" y1="484" x2="350" y2="488" stroke="#37474F" stroke-width="32"/>
<line x1="420" y1="392" x2="452" y2="482" stroke="#ECEFF1" stroke-width="40"/>
<line x1="452" y1="484" x2="350" y2="488" stroke="#ECEFF1" stroke-width="26"/>
</g>
<!-- foot, toes back on pad -->
<path d="M 352 478 C 340 476, 322 484, 308 494 C 302 499, 306 504, 314 504 L 350 502 C 360 500, 362 482, 352 478 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>

<!-- torso with pelvis (profile, facing right) -->
<path d="M 420 222 C 408 228, 400 238, 398 256 C 395 290, 398 320, 406 345 C 402 362, 394 378, 396 396 C 400 416, 430 420, 446 404 C 450 380, 448 360, 452 340 C 460 315, 470 290, 468 262 C 466 242, 458 230, 448 222 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<!-- latissimus dorsi (side view) -->
<path d="M 440 258 C 424 264, 408 284, 404 318 C 404 340, 410 356, 420 370 C 430 344, 444 306, 452 272 Z" fill="#E53935" opacity="0.75" stroke="#B71C1C" stroke-width="1.5"/>

<!-- arm: shoulder, elbow, hand on handle -->
<g stroke-linecap="round">
<line x1="436" y1="248" x2="510" y2="230" stroke="#37474F" stroke-width="34"/>
<line x1="510" y1="230" x2="522" y2="162" stroke="#37474F" stroke-width="27"/>
<line x1="436" y1="248" x2="510" y2="230" stroke="#ECEFF1" stroke-width="28"/>
<line x1="510" y1="230" x2="522" y2="162" stroke="#ECEFF1" stroke-width="21"/>
</g>
<circle cx="523" cy="152" r="13" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>

<!-- neck and head -->
<path d="M 424 202 L 422 230 L 452 230 L 452 202 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<ellipse cx="442" cy="178" rx="24" ry="30" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<path d="M 419 176 C 418 150, 450 142, 462 160" fill="none" stroke="#37474F" stroke-width="3"/>
<path d="M 465 176 L 472 188 L 465 190" fill="none" stroke="#37474F" stroke-width="2.5"/>

<!-- arrows -->
<line x1="300" y1="400" x2="300" y2="270" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="232" y="430" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">грудью</text>
<text x="232" y="452" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">к рукоятям</text>
<line x1="575" y1="215" x2="575" y2="300" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="548" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">локти</text>
<text x="548" y="352" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">вниз</text>

<!-- labels -->
<text x="140" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#263238">широчайшая</text>
<line x1="245" y1="206" x2="418" y2="315" stroke="#263238" stroke-width="1.5"/>
<text x="200" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#455A64">платформа помогает</text>
</svg>
