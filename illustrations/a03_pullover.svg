<text x="60" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#263238">широчайшая</text>
<text x="60" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#263238">мышца спины</text>
<line x1="200" y1="318" x2="412" y2="335" stroke="#263238" stroke-width="1.5"/>
<circle cx="414" cy="335" r="3" fill="#263238"/>
<text x="60" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#455A64">Лёгкий наклон, пресс напряжён</text>
<text x="60" y="584" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#455A64">4 по 15</text>
</svg>
