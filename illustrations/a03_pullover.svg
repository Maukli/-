<text x="560" y="485" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1E88E5">ведём вниз</text>
<text x="560" y="509" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1E88E5">к бёдрам</text>
