<path d="M302 438 Q312 424 328 428 L382 404 Q392 402 396 412 L392 420 L336 448 Q314 456 302 438 Z"/>
<path d="M382 404 L428 384 Q438 382 440 392 L438 398 L392 420 Z"/>
