<path d="M283 398 Q292 402 289 410" fill="none" stroke-width="2"/>
</g>
<!-- target muscle -->
<path d="M352 440 Q395 463 446 469 L446 486 Q396 482 350 458 Z" fill="#E53935" opacity="0.75"/>
