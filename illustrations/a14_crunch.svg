<ellipse cx="440" cy="390" rx="9" ry="11"/>
</g>
<!-- arrow -->
<path d="M222 478 Q196 400 250 345" fill="none" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="60" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">поднимаем голову и лопатки</text>
<!-- lower back note -->
<line x1="420" y1="510" x2="430" y2="560" stroke="#455A64" stroke-width="1.5"/>
<text x="380" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#455A64">поясница на полу</text>
<!-- muscle label -->
<line x1="400" y1="470" x2="600" y2="250" stroke="#263238" stroke-width="1.5"/>
<circle cx="400" cy="470" r="3" fill="#263238"/>
<text x="560" y="220" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#263238">Прямая мышца живота</text>
<text x="560" y="244" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#455A64">(верхняя часть)</text>
</svg>
