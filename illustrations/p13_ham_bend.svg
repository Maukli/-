<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ah" markerWidth="18" markerHeight="16" refX="4" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,8 L0,16 Z" fill="#1E88E5"/></marker>
</defs>
<text x="40" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#263238">Наклон к прямым ногам, носок на себя</text>
<text x="40" y="90" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#455A64">Пятка вперёд, колено прямое, наклон от таза с ровной спиной</text>
<!-- mat -->
<rect x="290" y="600" width="430" height="12" rx="4" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<g stroke-linecap="round" stroke-linejoin="round">
<!-- standing (back) leg -->
<polyline points="430,418 438,505 430,572" fill="none" stroke="#37474F" stroke-width="42"/>
<polyline points="430,418 438,505 430,572" fill="none" stroke="#ECEFF1" stroke-width="36"/>
<path d="M412,578 L446,578 Q482,584 486,598 L408,598 Q404,588 412,578 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<!-- front leg straight -->
<line x1="448" y1="420" x2="568" y2="572" stroke="#37474F" stroke-width="40"/>
<line x1="448" y1="420" x2="568" y2="572" stroke="#ECEFF1" stroke-width="34"/>
<path d="M552,566 Q556,598 576,598 Q590,596 596,580 L606,548 Q608,536 596,536 L582,548 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<circle cx="508" cy="496" r="3" fill="#37474F"/>
<!-- pelvis -->

<!-- torso -->
<path d="M404,392 L520,296 Q540,284 556,296 Q572,310 566,330 Q556,350 530,372 L478,420 Q468,444 444,448 Q410,450 398,425 Q394,404 404,392 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<!-- neck -->
<line x1="545" y1="318" x2="572" y2="292" stroke="#37474F" stroke-width="24"/>
<line x1="545" y1="318" x2="572" y2="292" stroke="#ECEFF1" stroke-width="18"/>
<!-- head -->
<ellipse cx="586" cy="276" rx="27" ry="30" fill="#ECEFF1" stroke="#37474F" stroke-width="3" transform="rotate(-30 586 276)"/>
<path d="M578,274 q-5,6 1,10" fill="none" stroke="#37474F" stroke-width="2"/>
<!-- near arm -->
<polyline points="540,330 548,408 508,482" fill="none" stroke="#37474F" stroke-width="28"/>
<polyline points="540,330 548,408 508,482" fill="none" stroke="#ECEFF1" stroke-width="22"/>
<ellipse cx="503" cy="490" rx="13" ry="10" fill="#ECEFF1" stroke="#37474F" stroke-width="3" transform="rotate(50 503 490)"/>
</g>
<!-- arrows -->
<path d="M445,275 Q530,200 625,240" fill="none" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="560" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1E88E5">корпус вперёд от таза</text>
<path d="M638,585 Q652,548 628,526" fill="none" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="665" y="555" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1E88E5">носок на себя</text>
</svg>
