<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1E88E5"/></marker>
</defs>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="30" y="50" font-size="30" font-weight="bold" fill="#263238">Тяга блока широким хватом в наклоне</text>
<text x="30" y="84" font-size="20" fill="#455A64">Тянем к груди, локти в стороны на уровне плеч, лопатки сводим</text>
</g>

<!-- floor -->
<line x1="250" y1="600" x2="880" y2="600" stroke="#78909C" stroke-width="2"/>
<!-- machine -->
<rect x="770" y="130" width="60" height="470" rx="6" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<circle cx="770" cy="322" r="17" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<circle cx="770" cy="322" r="4" fill="#78909C"/>
<!-- footplate -->
<rect x="585" y="470" width="22" height="115" rx="4" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="596" y="585" width="10" height="15" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<!-- bench -->
<rect x="250" y="470" width="230" height="20" rx="5" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="270" y="490" width="14" height="110" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<rect x="446" y="490" width="14" height="110" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<!-- cable -->
<line x1="476" y1="330" x2="770" y2="305" stroke="#78909C" stroke-width="3"/>

<!-- legs -->
<g stroke-linecap="round">
<line x1="365" y1="452" x2="468" y2="425" stroke="#37474F" stroke-width="50"/>
<line x1="468" y1="425" x2="560" y2="518" stroke="#37474F" stroke-width="38"/>
<line x1="560" y1="518" x2="575" y2="488" stroke="#37474F" stroke-width="22"/>
<line x1="365" y1="452" x2="468" y2="425" stroke="#ECEFF1" stroke-width="44"/>
<line x1="468" y1="425" x2="560" y2="518" stroke="#ECEFF1" stroke-width="32"/>
<line x1="560" y1="518" x2="575" y2="488" stroke="#ECEFF1" stroke-width="16"/>
</g>

<!-- torso -->
<path d="M 335 470 C 330 420, 350 350, 395 300 C 410 284, 440 284, 452 300 C 462 330, 452 370, 435 405 C 425 432, 415 455, 410 470 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<!-- neck and head -->
<path d="M 420 296 L 432 262 L 452 266 L 446 296 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<ellipse cx="450" cy="244" rx="25" ry="29" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<path d="M 474 238 L 481 250 L 474 253" fill="#ECEFF1" stroke="#37474F" stroke-width="3" stroke-linejoin="round"/>
<path d="M 428 230 C 430 210, 465 208, 473 230" fill="none" stroke="#37474F" stroke-width="3"/>

<!-- trapezius (profile) -->
<path d="M 400 296 C 380 310, 360 340, 350 375 C 344 395, 342 410, 343 420 L 360 412 C 362 390, 368 360, 385 335 C 395 320, 408 308, 425 300 Z" fill="#E53935" opacity="0.75"/>

<!-- arm -->
<g stroke-linecap="round">
<line x1="418" y1="312" x2="360" y2="316" stroke="#37474F" stroke-width="34"/>
<line x1="360" y1="316" x2="462" y2="330" stroke="#37474F" stroke-width="27"/>
<line x1="418" y1="312" x2="360" y2="316" stroke="#ECEFF1" stroke-width="28"/>
<line x1="360" y1="316" x2="462" y2="330" stroke="#ECEFF1" stroke-width="21"/>
</g>
<!-- rear delt -->
<ellipse cx="406" cy="312" rx="20" ry="16" fill="#E53935" opacity="0.75"/>
<!-- bar end-on and hand -->
<rect x="468" y="306" width="14" height="48" rx="5" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
<circle cx="472" cy="330" r="13" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>

<!-- arrows -->
<line x1="590" y1="288" x2="500" y2="292" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="515" y="276" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">к груди</text>
<line x1="345" y1="272" x2="285" y2="272" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="270" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#1E88E5">локти назад</text>

<!-- labels main -->
<g font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#263238">
<text x="560" y="175">задняя дельта</text>
<line x1="558" y1="170" x2="412" y2="308" stroke="#263238" stroke-width="1.5"/>
<text x="30" y="160">средняя и нижняя</text>
<text x="30" y="182">трапеция</text>
<line x1="120" y1="190" x2="354" y2="382" stroke="#263238" stroke-width="1.5"/>
</g>

<!-- inset back view -->
<rect x="20" y="330" width="220" height="300" rx="8" fill="#ffffff" stroke="#B0BEC5" stroke-width="2"/>
<text x="130" y="356" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#455A64">вид сзади</text>
<g stroke-linecap="round">
<line x1="62" y1="420" x2="40" y2="480" stroke="#37474F" stroke-width="28"/>
<line x1="198" y1="420" x2="220" y2="480" stroke="#37474F" stroke-width="28"/>
<line x1="62" y1="420" x2="40" y2="480" stroke="#ECEFF1" stroke-width="22"/>
<line x1="198" y1="420" x2="220" y2="480" stroke="#ECEFF1" stroke-width="22"/>
</g>
<path d="M 130 398 L 120 398 L 118 410 L 142 410 L 140 398 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<circle cx="130" cy="384" r="17" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<path d="M 75 408 Q 130 398 185 408 L 205 425 L 172 590 L 88 590 L 55 425 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/>
<!-- scapulae outlines -->
<path d="M 78 428 L 112 432 L 104 492 Z" fill="none" stroke="#78909C" stroke-width="2"/>
<path d="M 182 428 L 148 432 L 156 492 Z" fill="none" stroke="#78909C" stroke-width="2"/>
<!-- spine -->
<line x1="130" y1="412" x2="130" y2="585" stroke="#78909C" stroke-width="2" stroke-dasharray="4 4"/>
<!-- rhomboids -->
<path d="M 112 432 L 130 420 L 130 478 L 104 492 Z" fill="#E53935" opacity="0.75" stroke="#B71C1C" stroke-width="1.5"/>
<path d="M 148 432 L 130 420 L 130 478 L 156 492 Z" fill="#E53935" opacity="0.75" stroke="#B71C1C" stroke-width="1.5"/>
<!-- middle and lower trapezius -->
<path d="M 90 426 L 130 416 L 170 426 L 150 452 L 130 545 L 110 452 Z" fill="#E53935" opacity="0.55"/>
<!-- rear delts -->
<ellipse cx="62" cy="424" rx="13" ry="15" fill="#E53935" opacity="0.75"/>
<ellipse cx="198" cy="424" rx="13" ry="15" fill="#E53935" opacity="0.75"/>
<!-- scapula squeeze arrows -->
<line x1="68" y1="520" x2="100" y2="520" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<line x1="192" y1="520" x2="160" y2="520" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="130" y="614" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#1E88E5">сводим лопатки</text>
<!-- rhomboid label -->
<text x="250" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#263238">ромбовидные</text>
<line x1="248" y1="554" x2="148" y2="465" stroke="#263238" stroke-width="1.5"/>
</svg>
