<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="900" height="650" fill="#ffffff"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" markerWidth="3.6" markerHeight="3.6" refX="5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 z" fill="#1E88E5"/></marker>
</defs>
<text x="40" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#263238">Колено к противоположному плечу</text>
<text x="40" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#455A64">Лёжа на спине: правое колено тянем через живот к левому плечу</text>
<text x="40" y="125" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#78909C">Вид сверху</text>

<!-- mat -->
<rect x="70" y="225" width="770" height="350" rx="18" fill="#B0BEC5" stroke="#78909C" stroke-width="3"/>
<!-- midline -->
<line x1="95" y1="400" x2="820" y2="400" stroke="#78909C" stroke-width="2" stroke-dasharray="10 8"/>
<text x="700" y="425" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#546E7A">средняя линия</text>

<g stroke="#37474F" stroke-width="3" fill="#ECEFF1" stroke-linejoin="round">
<!-- left leg straight on floor -->
<path d="M 430 358 C 500 352 560 360 610 362 C 680 364 740 367 775 369 L 775 391 C 740 393 680 396 610 398 C 560 400 500 402 430 402 Z"/>
<ellipse cx="605" cy="380" rx="11" ry="8" stroke-width="2"/>
<ellipse cx="792" cy="380" rx="18" ry="15"/>
<!-- torso -->
<path d="M 232 330 C 207 332 199 350 200 370 L 200 430 C 199 450 207 468 232 470 C 282 470 320 450 345 446 C 380 446 420 452 440 446 C 456 438 458 362 440 355 C 420 348 380 354 345 354 C 320 350 282 330 232 330 Z"/>
<!-- neck and head -->
<rect x="176" y="384" width="32" height="32" rx="6"/>
<ellipse cx="143" cy="400" rx="40" ry="34"/>
<ellipse cx="148" cy="400" rx="7" ry="5" stroke-width="2"/>
<!-- right thigh (pulled across) -->
<ellipse cx="388" cy="404" rx="56" ry="24" transform="rotate(30.5 388 404)"/>
<!-- right shin -->
<ellipse cx="333" cy="442" rx="64" ry="16" transform="rotate(101 333 442)"/>
<!-- right foot -->
<ellipse cx="330" cy="515" rx="22" ry="13" transform="rotate(15 330 515)"/>
<!-- right knee -->
<circle cx="345" cy="378" r="18"/>
<!-- left arm: hand on knee -->
<ellipse cx="259" cy="315" rx="44" ry="14" transform="rotate(-44 259 315)"/>
<ellipse cx="310" cy="320" rx="42" ry="12" transform="rotate(61 310 320)"/>
<ellipse cx="331" cy="358" rx="13" ry="11"/>
<!-- right arm: hand on ankle -->
<ellipse cx="246" cy="496" rx="43" ry="14" transform="rotate(64 246 496)"/>
<ellipse cx="292" cy="517" rx="30" ry="12" transform="rotate(-33 292 517)"/>
<ellipse cx="318" cy="499" rx="14" ry="12"/>
</g>

<!-- target: left shoulder -->
<circle cx="228" cy="342" r="22" fill="none" stroke="#1E88E5" stroke-width="3" stroke-dasharray="6 4"/>
<circle cx="228" cy="342" r="6" fill="#1E88E5"/>
<line x1="210" y1="328" x2="160" y2="285" stroke="#455A64" stroke-width="1.5"/>
<text x="95" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#263238">левое плечо</text>
<text x="245" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#263238">левая рука на колене, правая на лодыжке, таз лежит ровно</text>

<!-- arrow knee to opposite shoulder -->
<path d="M 372 392 Q 315 385 258 358" fill="none" stroke="#1E88E5" stroke-width="5" marker-end="url(#ah)"/>
<text x="470" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1E88E5">тянем колено к левому плечу</text>
<line x1="468" y1="306" x2="380" y2="388" stroke="#1E88E5" stroke-width="1.5"/>
</svg>
